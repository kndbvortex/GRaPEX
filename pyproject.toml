[project]
name = "grapex"
version = "1.0.0"
description = "GraPEX: GRAdual Pattern EXplainer for multivariate time series classification (ICDMW 2026)"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    # Core (GraPEX + benchmark)
    "numpy",
    "scipy",
    "pandas>=2.2.3",
    "scikit-learn>=1.7.2",
    "aeon[all_extras]>=1.3.0",
    "tslearn>=0.6",
    "tensorflow>=2.20.0",
    "keras>=3.12.0",
    "tf-keras>=2.20.1",
    "joblib>=1.2",
    "tqdm>=4.67.1",
    "matplotlib>=3.10.7",
    # Baselines (third_party/: TSInterpret, CONFETTI, LASTS)
    "torch>=2.9.1",
    "captum>=0.7.0",
    "shap>=0.49.1",
    "tf-explain>=0.3.1",
    "torchcam>=0.3.0",
    "scikit-optimize>=0.10.2",
    "pymoo>=0.6.1",
    "pymop>=0.2.4",
    "deap>=1.3.0",
    "pyts>=0.13.0",
    "sktime>=0.40.1",
    "seaborn>=0.13.2",
    "mrseql>=0.0.4",
    "tensorflow-probability>=0.25.0",
    "imbalanced-learn>=0.14.1",
]
